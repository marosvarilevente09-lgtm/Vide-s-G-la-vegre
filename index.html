<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026-os Videós és VTuber Gála</title>
    
    <!-- Fő stíluslapok -->
    <link rel="stylesheet" href="Szavazas-2026.css">
</head>
<body>

    <div class="container">

        <h1 class="title">2026-os Videós és VTuber Gála</h1>

        <div class="divider"></div>

        <!-- Szavazás előtti űrlap -->
        <form id="voteForm">
            <div class="form-group">
                <label for="name">Neved:</label><br>
                <input type="text" id="name" placeholder="Írd be a neved" required>
            </div>

            <div class="form-group">
                <label for="source">Honnét hallottál rólunk?</label><br>
                <input type="text" id="source" placeholder="Pl.: YouTube, barát, Discord" required>
            </div>

            <div class="next-button-container">
                <button type="submit" id="startLink" class="vote-button disabled" disabled>
                    Tovább a szavazásokhoz
                </button>
            </div>
        </form>

    </div>

    <script>
    const nameInput = document.getElementById("name");
    const sourceInput = document.getElementById("source");
    const startButton = document.getElementById("startLink");
    const voteForm = document.getElementById("voteForm");

    // Ellenőrzi, hogy ki van-e töltve mindkét mező
    function checkStartForm() {
        const nameFilled = nameInput.value.trim() !== "";
        const sourceFilled = sourceInput.value.trim() !== "";

        if (nameFilled && sourceFilled) {
            startButton.classList.remove("disabled");
            startButton.disabled = false;
        } else {
            startButton.classList.add("disabled");
            startButton.disabled = true;
        }
    }

    nameInput.addEventListener("input", checkStartForm);
    sourceInput.addEventListener("input", checkStartForm);

    // Űrlap elküldése a Worker-nek
    voteForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const name = nameInput.value.trim();
        const source = sourceInput.value.trim();

        if (!name || !source) {
            alert("Kérlek, töltsd ki mindkét mezőt!");
            return;
        }

        try {
            const res = await fetch("/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name, source })
            });

            const text = await res.text();
            alert(text);
            voteForm.reset();
            checkStartForm();
        } catch (err) {
            alert("Hiba történt az adatküldés során: " + err.message);
        }
    });
    </script>

</body>
</html>
